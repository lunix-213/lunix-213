<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../../img/favicon-32x32.png" rel="icon"/>
    <title>LUNIX // ANALISA DATA (DATA SUITE)</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        /* ========================================================= */
        /* CLEAN PROFESSIONAL WHITE & LIGHT LUXURY DESIGN SYSTEM */
        /* ========================================================= */
        :root {
            --bg-page: #f8fafc;
            --bg-page-soft: #f1f5f9;
            --bg-card: #ffffff;
            
            --border-subtle: #e2e8f0;
            --border-hover: #cbd5e1;
            
            --primary-indigo: #4f46e5;
            --indigo-light: #818cf8;
            --indigo-glow: rgba(79, 70, 229, 0.16);
            --cyan-accent: #0284c7;
            --emerald-accent: #059669;
            
            --text-title: #0f172a;
            --text-body: #334155;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;

            --shadow-card: 0 20px 45px -8px rgba(15, 23, 42, 0.08), 0 6px 16px -4px rgba(15, 23, 42, 0.04);
            --shadow-hover: 0 30px 60px -12px rgba(79, 70, 229, 0.15), 0 10px 24px -6px rgba(15, 23, 42, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-body);
            min-height: 100vh;
            height: 100vh;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(79, 70, 229, 0.04) 0%, transparent 45%),
                radial-gradient(circle at 85% 35%, rgba(2, 132, 199, 0.035) 0%, transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(5, 150, 105, 0.025) 0%, transparent 55%),
                radial-gradient(rgba(148, 163, 184, 0.2) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px;
            background-attachment: fixed;
        }

        /* Ambient Light Particles Engine */
        #ambient-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Subtle Corner Geometric Crosses */
        .page-cross {
            position: absolute;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            color: rgba(148, 163, 184, 0.35);
            font-weight: 300;
            pointer-events: none;
            z-index: 2;
        }
        .cross-tl { top: 90px; left: 40px; }
        .cross-tr { top: 90px; right: 40px; }
        .cross-bl { bottom: 40px; left: 40px; }
        .cross-br { bottom: 40px; right: 40px; }

        /* ========================================================= */
        /* MINIMALIST & AESTHETIC NAVBAR */
        /* ========================================================= */
        #main-header {
            position: relative;
            z-index: 100;
            padding: 20px 0 10px;
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-back-hub {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border-radius: 10px;
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            color: var(--primary-indigo);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
            transition: all 0.22s ease;
        }

        .nav-back-hub:hover {
            background: var(--primary-indigo);
            color: #ffffff;
            border-color: var(--primary-indigo);
            transform: translateX(-3px);
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
        }

        .brand-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-title);
            text-decoration: none;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title span {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }

        .nav-meta-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border-subtle);
            padding: 6px 14px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .meta-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--emerald-accent);
            box-shadow: 0 0 8px var(--emerald-accent);
        }

        /* ========================================================= */
        /* CENTER STAGE: THE EXECUTIVE PORTRAIT GLASS DECK */
        /* ========================================================= */
        .stage-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 10px 24px;
            position: relative;
            z-index: 10;
        }

        /* Ambient Center Backdrop Aura */
        .stage-aura {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 650px;
            height: 520px;
            background: radial-gradient(ellipse at center, rgba(79, 70, 229, 0.08) 0%, rgba(2, 132, 199, 0.04) 45%, transparent 70%);
            pointer-events: none;
            z-index: -1;
            filter: blur(40px);
        }

        /* The Presentation Glass Deck */
        .executive-deck-card {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 28px;
            padding: 38px 42px 34px;
            box-shadow: var(--shadow-card);
            max-width: 480px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(16px);
        }

        .executive-deck-card:hover {
            transform: translateY(-5px);
            border-color: rgba(79, 70, 229, 0.3);
            box-shadow: var(--shadow-hover);
        }

        /* Deck Top Category Tag */
        .deck-category-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary-indigo);
            background: rgba(79, 70, 229, 0.07);
            border: 1px solid rgba(79, 70, 229, 0.2);
            padding: 5px 16px;
            border-radius: 30px;
            margin-bottom: 24px;
        }

        /* Portrait Image Container */
        .portrait-frame-box {
            width: 100%;
            height: 240px;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            margin-bottom: 24px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
            background: var(--bg-page-soft);
        }

        .portrait-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 25%;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: block;
        }

        .executive-deck-card:hover .portrait-image {
            transform: scale(1.05);
        }

        .portrait-vignette {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.15) 0%, transparent 40%, transparent 60%, rgba(15, 23, 42, 0.4) 100%);
            pointer-events: none;
        }

        /* Deck Title */
        .deck-title-main {
            font-family: 'Syne', sans-serif;
            font-size: 2.1rem;
            font-weight: 800;
            color: var(--text-title);
            line-height: 1.15;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .deck-title-main span {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-style: italic;
            text-transform: none;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #4f46e5 0%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding-left: 4px;
        }

        /* Deck Description */
        .deck-description {
            font-size: 0.92rem;
            line-height: 1.6;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 28px;
            max-width: 400px;
        }

        /* The Core Single Action Button */
        .deck-launch-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 28px;
            border-radius: 16px;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-decoration: none;
            box-shadow: 0 6px 22px rgba(79, 70, 229, 0.35);
            transition: all 0.28s ease;
            position: relative;
            overflow: hidden;
        }

        .deck-launch-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .deck-launch-btn:hover::before {
            left: 100%;
        }

        .deck-launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.45);
            background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
        }

        .deck-launch-btn span.arrow-icon {
            font-size: 1.1rem;
            transition: transform 0.22s ease;
        }

        .deck-launch-btn:hover span.arrow-icon {
            transform: translate(3px, -3px);
        }

        /* ========================================================= */
        /* ELEGANT MINIMALIST FOOTER NOTE */
        /* ========================================================= */
        #main-footer {
            position: relative;
            z-index: 10;
            padding: 0 20px 22px;
            text-align: center;
        }

        .footer-note-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.74rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .footer-note-text span.heart {
            color: var(--primary-indigo);
            font-style: normal;
        }

        /* Responsive Mobile Adjustment */
        @media (max-height: 780px) {
            .portrait-frame-box { height: 180px; margin-bottom: 18px; }
            .executive-deck-card { padding: 26px 30px 24px; }
            .deck-title-main { font-size: 1.8rem; margin-bottom: 8px; }
            .deck-description { margin-bottom: 20px; font-size: 0.86rem; }
        }

        @media (max-width: 600px) {
            body { overflow-y: auto; height: auto; min-height: 100vh; }
            .executive-deck-card { padding: 28px 24px; }
            .deck-title-main { font-size: 1.75rem; }
            .nav-meta-badge { display: none; }
            .page-cross { display: none; }
        }
    </style>
</head>
<body>

    <!-- AMBIENT PARTICLES CANVAS -->
    <canvas id="ambient-canvas"></canvas>

    <!-- JAVASCRIPT: AMBIENT PARTICLES ENGINE (0% IDLE GPU) -->
    <script>
        (function() {
            const canvas = document.getElementById('ambient-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let width, height;
            let particles = [];
            let animId = null;
            let isVisible = true;

            const particleColors = ['#6366f1', '#4f46e5', '#0284c7', '#059669', '#94a3b8'];

            function initCanvas() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                particles = [];
                const count = Math.min(30, Math.floor((width * height) / 40000));

                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.25,
                        vy: - (Math.random() * 0.3 + 0.1),
                        radius: Math.random() * 2.0 + 0.8,
                        color: particleColors[Math.floor(Math.random() * particleColors.length)],
                        alpha: Math.random() * 0.3 + 0.1,
                        pulseSpeed: Math.random() * 0.015 + 0.005,
                        pulseDir: Math.random() > 0.5 ? 1 : -1
                    });
                }
            }

            function animate() {
                if (!isVisible) {
                    animId = null;
                    return;
                }

                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.y < -10) {
                        p.y = height + 10;
                        p.x = Math.random() * width;
                    }
                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;

                    p.alpha += p.pulseSpeed * p.pulseDir;
                    if (p.alpha > 0.45 || p.alpha < 0.08) {
                        p.pulseDir *= -1;
                    }

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0.04, Math.min(0.45, p.alpha));
                    ctx.fill();
                }

                ctx.globalAlpha = 1;
                animId = requestAnimationFrame(animate);
            }

            window.addEventListener('resize', initCanvas, { passive: true });
            
            document.addEventListener('visibilitychange', () => {
                isVisible = !document.hidden;
                if (isVisible) {
                    if (!animId) animate();
                }
            });

            initCanvas();
            animate();
        })();
    </script>
