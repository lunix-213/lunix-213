<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="img/favicon-32x32.png" rel="icon" type="image/png"/>
  <title>LUNIX DESK // Next-Gen Budget & Desk System</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ========================================================= */
    /* ROOT VARIABLES & CYBERPUNK GLASSMORPHISM THEME           */
    /* ========================================================= */
    :root {
      --void-950: #03010b;
      --void-900: #060414;
      --void-850: #0b0820;
      
      --accent-cyan: #00f7ff;
      --accent-cyan-glow: rgba(0, 247, 255, 0.4);
      
      --accent-violet: #7c3aed;
      --accent-purple: #a855f7;
      --accent-magenta: #ec4899;
      --accent-lavender: #c4b5fd;
      
      --accent-emerald: #10b981;

      --text-white: #ffffff;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      --card-bg: rgba(10, 7, 26, 0.72);
      
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-sci: 'Orbitron', sans-serif;
      --font-tech: 'Rajdhani', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--void-950);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      line-height: 1.6;
    }

    /* ── Ambient Background & Overlays ── */
    .bg-image {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('https://i.ibb.co.com/23yHRYs7/bg-new-art-4k.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: saturate(1.15) brightness(0.85);
      transform: scale(1.02);
      pointer-events: none;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(circle at 50% 30%, rgba(124, 58, 237, 0.2) 0%, transparent 65%),
        radial-gradient(circle at 15% 85%, rgba(0, 247, 255, 0.12) 0%, transparent 55%),
        linear-gradient(180deg,
          rgba(3, 1, 11, 0.6) 0%,
          rgba(6, 4, 20, 0.7) 40%,
          rgba(11, 8, 32, 0.85) 75%,
          rgba(3, 1, 11, 0.95) 100%
        );
      pointer-events: none;
    }

    /* Cyber Grid */
    .cyber-grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-image: 
        linear-gradient(to right, rgba(168, 85, 247, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 247, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
    }

    /* Ambient Canvas for Interactive Stars & Neon Particles */
    #ambient-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Animated Glowing Blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 2;
      opacity: 0.6;
    }
    .blob-1 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.35), transparent 70%);
      top: -12%;
      right: -8%;
      animation: float1 18s ease-in-out infinite alternate;
    }
    .blob-2 {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, rgba(0, 247, 255, 0.2), transparent 70%);
      bottom: -10%;
      left: -8%;
      animation: float2 22s ease-in-out infinite alternate;
    }
    .blob-3 {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.18), transparent 70%);
      top: 45%;
      left: 50%;
      transform: translateX(-50%);
      animation: float3 15s ease-in-out infinite alternate;
    }

    @keyframes float1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-35px, 35px) scale(1.08); }
    }
    @keyframes float2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.1); }
    }
    @keyframes float3 {
      0% { transform: translateX(-50%) translateY(0) scale(1); }
      100% { transform: translateX(-50%) translateY(-35px) scale(1.12); }
    }

    /* ========================================================= */
    /* HERO CONTAINER (CENTERED PORTAL)                          */
    /* ========================================================= */
    .hero-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
      padding: 40px 20px;
      width: 100%;
      max-width: 560px;
    }

    /* Tech Status Eyebrow */
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 100px;
      margin-bottom: 24px;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.15);
      animation: fadeIn 0.8s 0.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(-10px);
    }

    .hero-eyebrow-icon {
      color: var(--accent-cyan);
      font-size: 0.85rem;
    }

    .hero-eyebrow-text {
      font-family: var(--font-sci);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--accent-lavender);
      text-transform: uppercase;
    }

    /* ── Luxury Glassmorphism Card ── */
    .glass-card-wrapper {
      position: relative;
      width: 100%;
      perspective: 1000px;
    }

    .glass-card {
      position: relative;
      width: 100%;
      border-radius: 32px;
      animation: cardEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(25px) scale(0.97);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    /* Animated Holographic Border Beam */
    .glass-card::before {
      content: '';
      position: absolute;
      inset: -1.5px;
      border-radius: 33.5px;
      background: linear-gradient(
        135deg,
        rgba(0, 247, 255, 0.65),
        rgba(124, 58, 237, 0.35),
        rgba(236, 72, 153, 0.5),
        rgba(0, 247, 255, 0.65)
      );
      background-size: 300% 300%;
      animation: borderShift 6s ease-in-out infinite;
      z-index: -1;
      opacity: 0.9;
    }

    @keyframes borderShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .glass-card-inner {
      background: var(--card-bg);
      backdrop-filter: blur(36px) saturate(1.5);
      -webkit-backdrop-filter: blur(36px) saturate(1.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 50px 42px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.65),
        0 10px 30px rgba(124, 58, 237, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.4);
    }

    /* Top Beam Glow */
    .glass-card-inner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(0, 247, 255, 0.8),
        rgba(168, 85, 247, 0.8),
        rgba(0, 247, 255, 0.8),
        transparent
      );
      box-shadow: 0 0 12px rgba(0, 247, 255, 0.6);
    }

    /* Ambient Radial Lighting Inside Card */
    .card-radial-glow {
      position: absolute;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.22), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Mouse Spotlight Follower */
    .card-spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        550px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
        rgba(0, 247, 255, 0.09),
        transparent 40%
      );
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .glass-card:hover .card-spotlight {
      opacity: 1;
    }

    /* Cyber Corner Accent Brackets */
    .card-corner {
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--accent-cyan);
      pointer-events: none;
      opacity: 0.55;
    }
    .corner-tl { top: 14px; left: 14px; border-top: 2px solid; border-left: 2px solid; }
    .corner-tr { top: 14px; right: 14px; border-top: 2px solid; border-right: 2px solid; }
    .corner-bl { bottom: 14px; left: 14px; border-bottom: 2px solid; border-left: 2px solid; }
    .corner-br { bottom: 14px; right: 14px; border-bottom: 2px solid; border-right: 2px solid; }

    /* ── Holographic Desk Icon ── */
    .card-icon-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .card-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.25), rgba(0, 247, 255, 0.15));
      border: 1.5px solid rgba(0, 247, 255, 0.4);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow:
        0 8px 24px rgba(0, 247, 255, 0.25),
        inset 0 0 15px rgba(124, 58, 237, 0.3);
      transition: all 0.4s ease;
    }

    .card-icon svg {
      width: 34px;
      height: 34px;
      color: var(--accent-cyan);
      filter: drop-shadow(0 0 10px rgba(0, 247, 255, 0.6));
    }

    .card-icon-wrap:hover .card-icon {
      transform: scale(1.06) rotate(3deg);
      border-color: var(--accent-purple);
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
    }

    /* Radar Rings */
    .icon-ring {
      position: absolute;
      inset: -8px;
      border-radius: 28px;
      border: 1px dashed rgba(0, 247, 255, 0.3);
      animation: rotateRing 20s linear infinite;
    }

    .icon-ring-pulse {
      position: absolute;
      inset: -14px;
      border-radius: 34px;
      border: 1px solid rgba(168, 85, 247, 0.25);
      animation: pulseRadar 3s ease-out infinite;
    }

    @keyframes rotateRing {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseRadar {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.25); opacity: 0; }
    }

    /* ── Typography & Headings ── */
    .card-title {
      font-family: var(--font-sci);
      font-size: 2.35rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
      line-height: 1.15;
      margin-bottom: 12px;
      position: relative;
      z-index: 2;
    }

    .card-title .accent-text {
      background: linear-gradient(135deg, var(--accent-cyan) 0%, #a855f7 70%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 14px rgba(0, 247, 255, 0.4));
    }

    .version-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      background: rgba(0, 247, 255, 0.12);
      border: 1px solid rgba(0, 247, 255, 0.35);
      color: var(--accent-cyan);
      border-radius: 6px;
      vertical-align: middle;
      margin-left: 6px;
      letter-spacing: 0.5px;
    }

    .card-divider-line {
      width: 70px;
      height: 3px;
      margin: 16px auto 18px;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      position: relative;
      box-shadow: 0 0 10px rgba(0, 247, 255, 0.5);
    }

    .card-divider-line::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px #ffffff;
    }

    .card-subtitle {
      font-size: 0.95rem;
      font-weight: 400;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 30px;
      position: relative;
      z-index: 2;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ── Action Buttons ── */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      z-index: 2;
      margin-bottom: 24px;
    }

    /* Primary Launch Button */
    .btn-launch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 28px;
      background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 50%, #06b6d4 100%);
      background-size: 200% auto;
      color: #ffffff;
      font-family: var(--font-sci);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      box-shadow:
        0 8px 24px rgba(124, 58, 237, 0.45),
        0 0 20px rgba(0, 247, 255, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    /* Shimmer Sweep Animation */
    .btn-launch::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.3),
        transparent
      );
      animation: shimmer 3.5s infinite ease-in-out;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      35% { left: 100%; }
      100% { left: 100%; }
    }

    .btn-launch:hover {
      background-position: right center;
      transform: translateY(-3px) scale(1.01);
      box-shadow:
        0 14px 34px rgba(124, 58, 237, 0.6),
        0 0 30px rgba(0, 247, 255, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .btn-launch:active {
      transform: translateY(-1px) scale(0.985);
    }

    .btn-launch svg {
      width: 18px;
      height: 18px;
      transition: transform 0.35s ease;
    }

    .btn-launch:hover svg {
      transform: translateX(5px) scale(1.1);
    }

    /* Secondary Action Button (Copy Link) */
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 14px;
      color: var(--text-light);
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    .btn-secondary:hover {
      background: rgba(168, 85, 247, 0.15);
      border-color: var(--accent-purple);
      color: #ffffff;
      transform: translateY(-1.5px);
    }

    .btn-secondary svg {
      width: 15px;
      height: 15px;
      color: var(--accent-cyan);
    }

    /* ── Tech Meta Chips ── */
    .tech-meta-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      position: relative;
      z-index: 2;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tech-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-dim);
    }

    .tech-chip span {
      color: var(--text-muted);
    }

    .tech-chip-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: var(--accent-emerald);
      box-shadow: 0 0 6px var(--accent-emerald);
    }

    @keyframes cardEnter {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================================================= */
    /* MINIMAL FOOTER                                            */
    /* ========================================================= */
    .footer {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px 24px;
      width: 100%;
    }

    .footer-text {
      font-family: var(--font-sci);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.2);
      text-transform: uppercase;
    }

    .footer-text span {
      color: var(--accent-purple);
      opacity: 0.7;
    }

    /* ========================================================= */
    /* TOAST NOTIFICATION POPUP                                  */
    /* ========================================================= */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(8, 5, 24, 0.94);
      backdrop-filter: blur(20px);
      border: 1px solid var(--accent-emerald);
      border-radius: 12px;
      padding: 12px 20px;
      color: #ffffff;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(16, 185, 129, 0.3);
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-icon {
      color: var(--accent-emerald);
    }

    /* ========================================================= */
    /* RESPONSIVE DESIGN                                         */
    /* ========================================================= */
    @media (max-width: 640px) {
      .hero-container {
        padding: 30px 16px;
      }
      .glass-card-inner {
        padding: 40px 24px;
        border-radius: 24px;
      }
      .glass-card {
        border-radius: 24px;
      }
      .glass-card::before {
        border-radius: 25.5px;
      }
      .card-title {
        font-size: 1.95rem;
      }
      .card-subtitle {
        font-size: 0.88rem;
        margin-bottom: 24px;
      }
      .card-icon-wrap {
        width: 70px;
        height: 70px;
        margin-bottom: 20px;
      }
      .card-icon {
        width: 62px;
        height: 62px;
      }
      .card-icon svg {
        width: 30px;
        height: 30px;
      }
      .btn-launch {
        padding: 14px 20px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Dynamic Background Layers -->
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>
  <div class="cyber-grid-overlay"></div>
  <canvas id="ambient-canvas"></canvas>

  <!-- Glowing Neon Blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <!-- ========================================================= -->
  <!-- HERO MAIN SECTION (CENTERED FOCUS)                        -->
  <!-- ========================================================= -->
  <main class="hero-container" id="login">

    <!-- Top Badge -->
    <div class="hero-eyebrow">
      <span class="hero-eyebrow-icon">⚡</span>
      <span class="hero-eyebrow-text">LUNIX ECOSYSTEM • DESK SUITE 2026</span>
    </div>

    <!-- Main Glassmorphism Card -->
    <div class="glass-card-wrapper">
      <div class="glass-card" id="mainCard">
        <div class="glass-card-inner">

          <!-- Spotlights & Glows -->
          <div class="card-radial-glow"></div>
          <div class="card-spotlight" id="cardSpotlight"></div>

          <!-- Cyber Corner Accents -->
          <div class="card-corner corner-tl"></div>
          <div class="card-corner corner-tr"></div>
          <div class="card-corner corner-bl"></div>
          <div class="card-corner corner-br"></div>

          <!-- Holographic Desk Icon -->
          <div class="card-icon-wrap">
            <div class="icon-ring"></div>
            <div class="icon-ring-pulse"></div>
            <div class="card-icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">

  <!-- ========================================================= -->
  <!-- JAVASCRIPT LOGIC & PARTICLES ENGINE                       -->
  <!-- ========================================================= */ -->
  <script>
    // ── 1. Interactive Mouse Spotlight & 3D Tilt on Main Card ──
    const mainCard = document.getElementById('mainCard');
    if (mainCard) {
      mainCard.addEventListener('mousemove', (e) => {
        const rect = mainCard.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        mainCard.style.setProperty('--mouse-x', `${x}px`);
        mainCard.style.setProperty('--mouse-y', `${y}px`);

        // Subtle 3D Tilt Effect
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -4.5;
        const rotateY = ((x - centerX) / centerX) * 4.5;
        mainCard.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
      });

      mainCard.addEventListener('mouseleave', () => {
        mainCard.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      });
    }

    // ── 2. Copy WebApp URL to Clipboard with Toast ──
    const copyLinkBtn = document.getElementById('copyLinkBtn');
    const toast = document.getElementById('toast');
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbxO5sU2_GkiAl_ozIS5Zz6KBCYpCI0x5uCezuQSzsfjH7rMippOkjsCyKP1EW7eDvHI/exec';

    function showToast(msg) {
      if (!toast) return;
      const toastMsg = document.getElementById('toastMessage');
      if (toastMsg && msg) toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    if (copyLinkBtn) {
      copyLinkBtn.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(webAppUrl);
          showToast('Tautan LUNIX Desk berhasil disalin!');
        } catch (err) {
          const input = document.createElement('input');
          input.value = webAppUrl;
          document.body.appendChild(input);
          input.select();
          document.execCommand('copy');
          document.body.removeChild(input);
          showToast('Tautan LUNIX Desk berhasil disalin!');
        }
      });
    }

    // ── 3. Lightweight HTML5 Canvas Ambient Particle Engine ──
    (function initCanvasParticles() {
      const canvas = document.getElementById('ambient-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const particles = [];
      const particleCount = Math.min(Math.floor((width * height) / 18000), 55);

      class Particle {
        constructor() {
          this.reset(true);
        }

        reset(initial = false) {
          this.x = Math.random() * width;
          this.y = initial ? Math.random() * height : height + 10;
          this.size = Math.random() * 2 + 0.6;
          this.speedY = Math.random() * 0.35 + 0.15;
          this.speedX = (Math.random() - 0.5) * 0.2;
          this.opacity = Math.random() * 0.6 + 0.2;
          this.pulse = Math.random() * 0.02 + 0.005;
          this.pulseDir = 1;
          this.color = Math.random() > 0.5 ? 'rgba(0, 247, 255, ' : 'rgba(168, 85, 247, ';
        }

        update() {
          this.y -= this.speedY;
          this.x += this.speedX;

          this.opacity += this.pulse * this.pulseDir;
          if (this.opacity > 0.85) this.pulseDir = -1;
          if (this.opacity < 0.2) this.pulseDir = 1;

          if (this.y < -10 || this.x < -10 || this.x > width + 10) {
            this.reset();
          }
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `${this.color}${this.opacity})`;
          ctx.shadowBlur = 10;
          ctx.shadowColor = this.color.includes('247') ? '#00f7ff' : '#a855f7';
          ctx.fill();
        }
      }

      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>
