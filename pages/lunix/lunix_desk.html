<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="img/favicon-32x32.png" rel="icon" type="image/png"/>
  <title>LUNIX DESK // Next-Gen Budget & Desk System</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600;1,700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <style>
    /* ========================================================= */
    /* MONOCHROME OBSIDIAN & PURE WHITE — FUTURE MINIMALIST      */
    /* ========================================================= */
    :root {
      --bg-void: #040406;
      --bg-obsidian: #0a0a0d;
      --bg-monolith: rgba(12, 12, 16, 0.78);
      --bg-elevated: rgba(255, 255, 255, 0.04);

      --white: #ffffff;
      --platinum: #e4e4e7;
      --silver: #a1a1aa;
      --ash: #71717a;
      --graphite: #27272a;

      --border-hairline: rgba(255, 255, 255, 0.1);
      --border-crisp: rgba(255, 255, 255, 0.24);

      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Syne', sans-serif;
      --font-editorial: 'Cormorant Garamond', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100svh;
      overflow-x: hidden;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-void);
      color: var(--platinum);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ========================================================= */
    /* ARCHITECTURAL MONOCHROME BACKDROP & PERSPECTIVE STAGE     */
    /* ========================================================= */
    .mono-backdrop {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.075) 0%, rgba(255, 255, 255, 0.02) 32%, transparent 64%),
        radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
        linear-gradient(180deg, #030305 0%, #07070a 55%, #020203 100%);
    }

    /* Fine architectural coordinate grid */
    .architectural-grid {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 78% 72% at 50% 48%, #000 15%, transparent 78%);
      -webkit-mask-image: radial-gradient(ellipse 78% 72% at 50% 48%, #000 15%, transparent 78%);
    }

    /* Subtle futuristic horizon beam (GPU transform only) */
    .horizon-scan {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      height: 1px;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.22) 50%, transparent 100%);
      opacity: 0;
      transform: translateY(-10vh);
      animation: horizonSweep 9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes horizonSweep {
      0% { transform: translateY(-5vh); opacity: 0; }
      10% { opacity: 0.55; }
      75% { opacity: 0.2; }
      100% { transform: translateY(105vh); opacity: 0; }
    }

    /* Interactive Monochrome Vector Canvas */
    #ambient-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* Corner Viewport Precision Marks */
    .viewport-cross {
      position: fixed;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.22);
      pointer-events: none;
      z-index: 5;
      user-select: none;
    }
    .vc-bl { bottom: 26px; left: 28px; }
    .vc-br { bottom: 26px; right: 28px; }

    /* ========================================================= */
    /* TOP HUD NAVIGATION BAR                                    */
    /* ========================================================= */
    .top-hud {
      width: 100%;
      max-width: 1240px;
      padding: 20px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: relative;
      z-index: 20;
      opacity: 0;
      transform: translateY(-10px);
      animation: hudFadeIn 0.7s 0.05s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .nav-back-hub {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-hairline);
      color: var(--platinum);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-decoration: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.22s ease, background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease;
    }

    .nav-back-hub:hover {
      background: var(--white);
      color: var(--bg-void);
      border-color: var(--white);
      transform: translateX(-2px);
    }

    .hud-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-hairline);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--silver);
      backdrop-filter: blur(10px);
    }

    .status-beacon {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--white);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
      animation: beaconPulse 2.4s ease-in-out infinite;
    }

    @keyframes beaconPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.75); }
    }

    /* ========================================================= */
    /* CENTER MONOLITH STAGE                                     */
    /* ========================================================= */
    .stage-center {
      flex: 1;
      width: 100%;
      max-width: 580px;
      padding: 16px 20px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 10;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.16);
      margin-bottom: 22px;
      opacity: 0;
      transform: translateY(-10px);
      animation: hudFadeIn 0.7s 0.12s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .hero-eyebrow-text {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--platinum);
      text-transform: uppercase;
    }

    /* ── Kinetic Monolith Card ── */
    .monolith-wrapper {
      position: relative;
      width: 100%;
      perspective: 1100px;
    }

    .monolith-card {
      position: relative;
      width: 100%;
      border-radius: 28px;
      padding: 1px; /* Hairline border container */
      overflow: hidden;
      opacity: 0;
      transform: translateY(26px) scale(0.96);
      animation: monolithEnter 0.9s 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease;
      box-shadow:
        0 32px 80px -12px rgba(0, 0, 0, 0.9),
        0 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    /* Orbiting Metallic Silver Border Beam */
    .monolith-card::before {
      content: '';
      position: absolute;
      inset: -40%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 255deg,
        rgba(255, 255, 255, 0.55) 295deg,
        rgba(255, 255, 255, 0.95) 310deg,
        rgba(255, 255, 255, 0.35) 328deg,
        transparent 355deg
      );
      animation: orbitBeam 7s linear infinite;
      pointer-events: none;
      z-index: 0;
      will-change: transform;
    }

    @keyframes orbitBeam {
      to { transform: rotate(360deg); }
    }

    .monolith-inner {
      position: relative;
      z-index: 1;
      background: linear-gradient(165deg, rgba(16, 16, 20, 0.94) 0%, rgba(7, 7, 10, 0.96) 100%);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border-radius: 27px;
      padding: 46px 38px 36px;
      text-align: center;
      overflow: hidden;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        inset 0 -1px 0 rgba(255, 255, 255, 0.04);
    }

    /* Top Hairline Light Crown */
    .monolith-inner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 18%;
      right: 18%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
      pointer-events: none;
    }

    /* Dynamic Specular Spotlight on Hover */
    .card-spotlight {
      position: absolute;
      inset: 0;
      background: radial-gradient(
        460px circle at var(--mouse-x, 50%) var(--mouse-y, 35%),
        rgba(255, 255, 255, 0.075),
        transparent 52%
      );
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 1;
    }

    .monolith-card:hover .card-spotlight {
      opacity: 1;
    }

    /* Corner Precision Brackets */
    .card-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: rgba(255, 255, 255, 0.38);
      pointer-events: none;
      z-index: 2;
    }
    .corner-tl { top: 16px; left: 16px; border-top: 1.5px solid; border-left: 1.5px solid; }
    .corner-tr { top: 16px; right: 16px; border-top: 1.5px solid; border-right: 1.5px solid; }
    .corner-bl { bottom: 16px; left: 16px; border-bottom: 1.5px solid; border-left: 1.5px solid; }
    .corner-br { bottom: 16px; right: 16px; border-bottom: 1.5px solid; border-right: 1.5px solid; }

    /* ── Futuristic Orbital Emblem ── */
    .emblem-stage {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .orbital-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .orbit-outer {
      transform-origin: center;
      animation: spinSlow 24s linear infinite;
    }

    .orbit-inner {
      transform-origin: center;
      animation: spinReverse 16s linear infinite;
    }

    @keyframes spinSlow {
      to { transform: rotate(360deg); }
    }
    @keyframes spinReverse {
      to { transform: rotate(-360deg); }
    }

    .emblem-core {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      box-shadow:
        0 10px 26px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
    }

    .monolith-card:hover .emblem-core {
      transform: scale(1.06);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .emblem-core svg {
      width: 26px;
      height: 26px;
    }

    /* ── Monumental Monochrome Typography ── */
    .card-title {
      position: relative;
      z-index: 2;
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 2.55rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.1;
      color: var(--white);
      margin-bottom: 10px;
    }

    .card-title .accent-serif {
      font-family: var(--font-editorial);
      font-style: italic;
      font-weight: 700;
      font-size: 1.12em;
      letter-spacing: 0.01em;
      background: linear-gradient(180deg, #ffffff 15%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding-right: 4px;
    }

    .version-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 700;
      padding: 4px 9px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: var(--white);
      border-radius: 6px;
      vertical-align: middle;
      margin-left: 6px;
      letter-spacing: 0.06em;
    }

    /* Kinetic Energy Divider */
    .laser-divider {
      position: relative;
      width: 112px;
      height: 1px;
      margin: 18px auto 20px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      z-index: 2;
    }

    .laser-node {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 28px;
      height: 2px;
      border-radius: 99px;
      background: var(--white);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.85);
      transform: translate(-50%, -50%);
      animation: laserSlide 3.6s ease-in-out infinite;
    }

    @keyframes laserSlide {
      0%, 100% { transform: translate(-115%, -50%); opacity: 0.55; }
      50% { transform: translate(15%, -50%); opacity: 1; }
    }

    .card-subtitle {
      position: relative;
      z-index: 2;
      font-size: 0.96rem;
      font-weight: 400;
      color: var(--silver);
      line-height: 1.68;
      max-width: 410px;
      margin: 0 auto 30px;
    }

    /* ── High-Contrast Monochrome Action Stack ── */
    .button-group {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-bottom: 26px;
    }

    /* Primary Pure-White Button on Obsidian */
    .btn-launch {
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 26px;
      border-radius: 14px;
      background: var(--white);
      color: var(--bg-void);
      font-family: var(--font-display);
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid var(--white);
      box-shadow: 0 14px 34px -10px rgba(255, 255, 255, 0.32);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.28s ease, background-color 0.25s ease;
    }

    .btn-launch::before {
      content: '';
      position: absolute;
      top: 0;
      left: -120%;
      width: 75%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.12), transparent);
      transform: skewX(-22deg);
      animation: sheenSweep 4.2s ease-in-out infinite;
    }

    @keyframes sheenSweep {
      0% { left: -120%; }
      38% { left: 150%; }
      100% { left: 150%; }
    }

    .btn-launch:hover {
      transform: translateY(-2px);
      background: #f4f4f5;
      box-shadow: 0 20px 42px -10px rgba(255, 255, 255, 0.48);
    }

    .btn-launch:active {
      transform: translateY(0) scale(0.99);
    }

    .btn-launch svg {
      width: 17px;
      height: 17px;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-launch:hover svg {
      transform: translateX(4px);
    }

    /* Secondary Ghost Monochrome Action */
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 13px 22px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-hairline);
      color: var(--platinum);
      font-family: var(--font-sans);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.22s ease, background-color 0.22s ease, border-color 0.22s ease, color 0.22s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-crisp);
      color: var(--white);
      transform: translateY(-1px);
    }

    .btn-secondary svg {
      width: 15px;
      height: 15px;
      color: var(--silver);
      transition: color 0.2s ease;
    }

    .btn-secondary:hover svg {
      color: var(--white);
    }

    /* ── Tech Telemetry Footer Inside Monolith ── */
    .tech-meta-row {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tech-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--silver);
    }

    .tech-chip-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: var(--white);
      opacity: 0.85;
    }

    @keyframes monolithEnter {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes hudFadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========================================================= */
    /* MINIMAL MONOCHROME FOOTER                                 */
    /* ========================================================= */
    .footer {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 18px 24px 24px;
      width: 100%;
    }

    .footer-text {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.32);
      text-transform: uppercase;
    }

    .footer-text span {
      color: var(--platinum);
    }

    /* ========================================================= */
    /* TOAST NOTIFICATION                                        */
    /* ========================================================= */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--white);
      color: var(--bg-void);
      border-radius: 999px;
      padding: 11px 20px;
      font-size: 0.84rem;
      font-weight: 700;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
      transform: translateY(18px);
      opacity: 0;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* ========================================================= */
    /* REDUCED MOTION & RESPONSIVE                               */
    /* ========================================================= */
    @media (prefers-reduced-motion: reduce) {
      .monolith-card,
      .hero-eyebrow,
      .top-hud {
        opacity: 1;
        transform: none;
        animation: none;
      }
      .monolith-card::before,
      .orbit-outer,
      .orbit-inner,
      .horizon-scan,
      .laser-node,
      .status-beacon,
      .btn-launch::before {
        animation: none;
      }
    }

    @media (max-width: 640px) {
      .top-hud {
        padding: 16px;
      }
      .hud-status-pill {
        display: none;
      }
      .viewport-cross {
        display: none;
      }
      .stage-center {
        padding: 12px 16px 24px;
      }
      .monolith-inner {
        padding: 36px 22px 28px;
        border-radius: 23px;
      }
      .monolith-card {
        border-radius: 24px;
      }
      .emblem-stage {
        width: 82px;
        height: 82px;
        margin-bottom: 18px;
      }
      .emblem-core {
        width: 50px;
        height: 50px;
      }
      .card-subtitle {
        font-size: 0.88rem;
        margin-bottom: 24px;
      }
      .btn-launch {
        padding: 14px 20px;
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>

  <!-- Architectural Monochrome Backdrop Layers -->
  <div class="mono-backdrop" aria-hidden="true"></div>
  <div class="architectural-grid" aria-hidden="true"></div>
  <div class="horizon-scan" aria-hidden="true"></div>
  <canvas id="ambient-canvas" aria-hidden="true"></canvas>

  <span class="viewport-cross vc-bl" aria-hidden="true">+</span>
  <span class="viewport-cross vc-br" aria-hidden="true">+</span>

  <!-- ========================================================= -->
  <!-- TOP HUD BAR                                               -->
  <!-- ========================================================= -->
  <header class="top-hud">
    <a href="../../index.html" class="nav-back-hub" title="Kembali ke LUNIX Master Hub">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      <span>HUB</span>
    </a>

    <div class="hud-status-pill">
      <span class="status-beacon" aria-hidden="true"></span>
      <span>SYS.READY // MONOLITH 2026</span>
    </div>
  </header>

  <!-- ========================================================= -->
  <!-- CENTER MONOLITH PORTAL                                    -->
  <!-- ========================================================= -->
  <main class="stage-center" id="login">

          <!-- Dual-Orbit Monochrome Telemetry Emblem -->
          <div class="emblem-stage">

              <circle class="orbit-outer" cx="50" cy="50" r="46" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="4 6"/>
              <circle class="orbit-inner" cx="50" cy="50" r="37" stroke="rgba(255,255,255,0.38)" stroke-width="1" stroke-dasharray="18 22 4 14"/>

            </svg>
            <div class="emblem-core">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.75" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z" />
              </svg>
            </div>

          <!-- Monochrome Display Typography -->
          <h1 class="card-title">
            LUNIX <span class="accent-serif">Desk</span>
            <span class="version-tag">v2.6</span>
          </h1>

          <div class="laser-divider" aria-hidden="true">
            <span class="laser-node"></span>
          </div>

          <p class="card-subtitle">
            Manage desk dan anggaran lebih mudah.
          </p>

          <!-- Primary & Secondary Actions -->
          <div class="button-group">
            <a href="https://script.google.com/macros/s/AKfycbxO5sU2_GkiAl_ozIS5Zz6KBCYpCI0x5uCezuQSzsfjH7rMippOkjsCyKP1EW7eDvHI/exec"
               class="btn-launch"
               id="launchBtn"
               target="_blank"
               rel="noopener noreferrer">
              <span>Mulai Sekarang</span>
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.4" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
              </svg>
            </a>

            <button type="button" class="btn-secondary" id="copyLinkBtn">
              <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
              </svg>
              <span id="copyBtnLabel">Salin Tautan</span>
            </button>
          </div>

          <!-- Minimal Telemetry Strip -->
          <div class="tech-meta-row">
            <div class="tech-chip">

  </main>

  <!-- ========================================================= -->
  <!-- MINIMAL FOOTER                                            -->
  <!-- ========================================================= -->
  <footer class="footer">
    <span class="footer-text">&copy; 2026 <span>LUNIX 213</span></span>
  </footer>

  <!-- Toast Notification -->
  <div class="toast-container">
    <div class="toast" id="toast" role="status" aria-live="polite">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.6">
        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
      </svg>
      <span id="toastMessage">Tautan LUNIX Desk berhasil disalin</span>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const webAppUrl = 'https://script.google.com/macros/s/AKfycbxO5sU2_GkiAl_ozIS5Zz6KBCYpCI0x5uCezuQSzsfjH7rMippOkjsCyKP1EW7eDvHI/exec';

      /* ---------------------------------------------------------------
         1. KINETIC MONOCHROME SCRAMBLE DECODE ON EYEBROW
         --------------------------------------------------------------- */
      const scrambleEl = document.getElementById('scrambleEyebrow');
      if (scrambleEl && !reducedMotion) {
        const finalText = scrambleEl.textContent.trim();
        const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/•';
        let iteration = 0;

        const timer = setInterval(function () {
          scrambleEl.textContent = finalText
            .split('')
            .map(function (ch, idx) {
              if (ch === ' ' || ch === '•') return ch;
              if (idx < iteration) return finalText[idx];
              return glyphs[Math.floor(Math.random() * glyphs.length)];
            })
            .join('');

          iteration += 1.3;
          if (iteration >= finalText.length) {
            scrambleEl.textContent = finalText;
            clearInterval(timer);
          }
        }, 28);
      }

      /* ---------------------------------------------------------------
         2. RESTRAINED 3D TILT & SPECULAR SPOTLIGHT (DESKTOP HOVER)
         --------------------------------------------------------------- */
      const mainCard = document.getElementById('mainCard');
      if (mainCard && window.matchMedia('(hover: hover)').matches && !reducedMotion) {
        mainCard.addEventListener('pointermove', function (e) {
          const rect = mainCard.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          mainCard.style.setProperty('--mouse-x', x + 'px');
          mainCard.style.setProperty('--mouse-y', y + 'px');

          const rx = ((y - rect.height / 2) / (rect.height / 2)) * -3.2;
          const ry = ((x - rect.width / 2) / (rect.width / 2)) * 3.2;
          mainCard.style.transform = 'perspective(1100px) rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg)';
        });

        mainCard.addEventListener('pointerleave', function () {
          mainCard.style.transform = 'perspective(1100px) rotateX(0deg) rotateY(0deg)';
        });
      }

      /* ---------------------------------------------------------------
         3. CLIPBOARD COPY & TOAST NOTIFICATION
         --------------------------------------------------------------- */
      const copyLinkBtn = document.getElementById('copyLinkBtn');
      const copyBtnLabel = document.getElementById('copyBtnLabel');
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMessage');
      let toastTimer = null;

      function showToast(msg) {
        if (!toast) return;
        if (toastMsg && msg) toastMsg.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove('show');
        }, 2600);
      }

      if (copyLinkBtn) {
        copyLinkBtn.addEventListener('click', function () {
          const onCopied = function () {
            if (copyBtnLabel) copyBtnLabel.textContent = '✓ Tautan Tersalin';
            showToast('Tautan LUNIX Desk berhasil disalin');
            setTimeout(function () {
              if (copyBtnLabel) copyBtnLabel.textContent = 'Salin Tautan';
            }, 2200);
          };

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(webAppUrl).then(onCopied).catch(function () {
              showToast('Tautan siap digunakan');
            });
          } else {
            const tmp = document.createElement('input');
            tmp.value = webAppUrl;
            document.body.appendChild(tmp);
            tmp.select();
            document.execCommand('copy');
            document.body.removeChild(tmp);
            onCopied();
          }
        });
      }

      /* ---------------------------------------------------------------
         4. ULTRA-LIGHT MONOCHROME VECTOR CONSTELLATION CANVAS
         --------------------------------------------------------------- */
      const canvas = document.getElementById('ambient-canvas');
      if (canvas && !reducedMotion) {
        const ctx = canvas.getContext('2d');
        if (ctx) {
          let w = 0, h = 0, nodes = [], rafId = null;
          let pointer = { x: -9999, y: -9999 };

          function initField() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            const count = Math.min(28, Math.max(12, Math.floor((w * h) / 48000)));
            nodes = [];
            for (let i = 0; i < count; i++) {
              nodes.push({
                x: Math.random() * w,
                y: Math.random() * h,
                vx: (Math.random() - 0.5) * 0.28,
                vy: (Math.random() - 0.5) * 0.28,
                r: Math.random() * 1.4 + 0.7,
                a: Math.random() * 0.32 + 0.14
              });
            }
          }

          function renderFrame() {
            if (document.hidden) {
              rafId = null;
              return;
            }
            ctx.clearRect(0, 0, w, h);

            for (let i = 0; i < nodes.length; i++) {
              const n = nodes[i];
              n.x += n.vx;
              n.y += n.vy;

              if (n.x < 0 || n.x > w) n.vx *= -1;
              if (n.y < 0 || n.y > h) n.vy *= -1;

              // Draw crisp monochrome node
              ctx.fillStyle = 'rgba(255, 255, 255, ' + n.a + ')';
              ctx.beginPath();
              ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
              ctx.fill();

              // Subtle proximity link to neighbor nodes
              for (let j = i + 1; j < nodes.length; j++) {
                const m = nodes[j];
                const dx = n.x - m.x;
                const dy = n.y - m.y;
                const distSq = dx * dx + dy * dy;
                if (distSq < 15625) { // 125px
                  const lineAlpha = (1 - Math.sqrt(distSq) / 125) * 0.085;
                  ctx.strokeStyle = 'rgba(255, 255, 255, ' + lineAlpha.toFixed(3) + ')';
                  ctx.lineWidth = 0.7;
                  ctx.beginPath();
                  ctx.moveTo(n.x, n.y);
                  ctx.lineTo(m.x, m.y);
                  ctx.stroke();
                }
              }

              // Delicate pointer attraction line
              if (pointer.x > 0) {
                const pdx = n.x - pointer.x;
                const pdy = n.y - pointer.y;
                const pDistSq = pdx * pdx + pdy * pdy;
                if (pDistSq < 25600) { // 160px
                  const pAlpha = (1 - Math.sqrt(pDistSq) / 160) * 0.18;
                  ctx.strokeStyle = 'rgba(255, 255, 255, ' + pAlpha.toFixed(3) + ')';
                  ctx.lineWidth = 0.8;
                  ctx.beginPath();
                  ctx.moveTo(n.x, n.y);
                  ctx.lineTo(pointer.x, pointer.y);
                  ctx.stroke();
                }
              }
            }

            rafId = requestAnimationFrame(renderFrame);
          }

          if (window.matchMedia('(hover: hover)').matches) {
            window.addEventListener('pointermove', function (e) {
              pointer.x = e.clientX;
              pointer.y = e.clientY;
            }, { passive: true });
            window.addEventListener('pointerleave', function () {
              pointer.x = -9999;
              pointer.y = -9999;
            });
          }

          let resizeTimer = null;
          window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(initField, 180);
          }, { passive: true });

          document.addEventListener('visibilitychange', function () {
            if (!document.hidden && !rafId) {
              renderFrame();
            }
          });

          initField();
          renderFrame();
        }
      }
    })();
  </script>
