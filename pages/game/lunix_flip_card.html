<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUNIX Memory Cards Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Quicksand', sans-serif;
            background: #2d2d2d;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }
        
        .game-header {
            text-align: center;
            padding: 20px;
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* 3D Effect */
            color: #fff;
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15);
            transform: perspective(500px) rotateX(10deg);
            transition: all 0.5s ease;
        }
        
        h1:hover {
            transform: perspective(500px) rotateX(0deg);
            text-shadow: 
                0 1px 0 #ccc,
                0 2px 0 #c9c9c9,
                0 3px 0 #bbb,
                0 4px 0 #b9b9b9,
                0 5px 0 #aaa,
                0 6px 1px rgba(0,0,0,.1),
                0 0 5px rgba(0,0,0,.1),
                0 1px 3px rgba(0,0,0,.3),
                0 3px 5px rgba(0,0,0,.2),
                0 5px 10px rgba(0,0,0,.25),
                0 10px 10px rgba(0,0,0,.2),
                0 20px 20px rgba(0,0,0,.15),
                0 0 30px rgba(138, 43, 226, 0.8);
        }
        
        .music-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .music-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: rgba(138, 43, 226, 0.3);
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .music-btn:hover {
            background: rgba(138, 43, 226, 0.5);
            transform: scale(1.1);
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .volume-slider {
            width: 100px;
            height: 5px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(138, 43, 226, 0.3);
            border-radius: 5px;
            outline: none;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 15px;
            height: 15px;
            background: #8a2be2;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .game-controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .difficulty-btn, .control-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            background: rgba(138, 43, 226, 0.3);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }
        
        .difficulty-btn:hover, .control-btn:hover {
            background: rgba(138, 43, 226, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }
        
        .difficulty-btn.active {
            background: linear-gradient(45deg, #8a2be2, #9932cc);
            color: #fff;
        }
        
        .game-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(138, 43, 226, 0.3);
        }
        
        .game-board {
            display: grid;
            gap: 15px;
            padding: 20px;
            perspective: 1000px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
        }
        
        .game-board.small {
            grid-template-columns: repeat(4, 1fr);
        }
        
        .game-board.medium {
            grid-template-columns: repeat(4, 1fr);
        }
        
        .game-board.large {
            grid-template-columns: repeat(6, 1fr);
        }
        
        .card {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .card.flipped {
            transform: rotateY(180deg);
        }
        
        .card.matched {
            animation: matchPulse 0.6s ease;
            pointer-events: none;
        }
        
        @keyframes matchPulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
            100% { transform: rotateY(180deg) scale(1); }
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }
        
        .card-front {
            background: linear-gradient(135deg, #8a2be2 0%, #6a1b9a 100%);
            border: 3px solid rgba(255, 255, 255, 0.2);
            transform: rotateY(180deg);
        }
        
        .card-back {
            background: linear-gradient(135deg, #9932cc 0%, #7b1fa2 100%);
            border: 3px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .card-back::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
            transform: rotate(45deg);
            animation: shimmer 3s infinite linear;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .card-icon {
            width: 80%;
            height: 80%;
            object-fit: contain;
            filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.3));
        }
        
        .card-number {
            font-size: 3rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background: linear-gradient(135deg, #4a148c 0%, #6a1b9a 100%);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: modalAppear 0.5s ease;
            border: 1px solid rgba(138, 43, 226, 0.5);
        }
        
        @keyframes modalAppear {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .modal h2 {
            margin-bottom: 20px;
            font-size: 2rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .modal p {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .close-modal {
            padding: 10px 25px;
            border: none;
            border-radius: 30px;
            background: rgba(138, 43, 226, 0.3);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }
        
        .close-modal:hover {
            background: rgba(138, 43, 226, 0.5);
            transform: translateY(-3px);
        }
        
        @media (max-width: 768px) {
            h1 { 
                font-size: 2rem; 
                text-shadow: 
                    0 1px 0 #ccc,
                    0 2px 0 #c9c9c9,
                    0 3px 0 #bbb,
                    0 4px 0 #b9b9b9,
                    0 5px 0 #aaa,
                    0 6px 1px rgba(0,0,0,.1),
                    0 0 5px rgba(0,0,0,.1),
                    0 1px 3px rgba(0,0,0,.3),
                    0 3px 5px rgba(0,0,0,.2),
                    0 5px 10px rgba(0,0,0,.25);
            }
            .game-stats { flex-direction: column; gap: 10px; }
            .game-board { gap: 10px; padding: 10px; }
            .card-number { font-size: 2rem; }
            .music-controls { gap: 10px; }
            .volume-slider { width: 80px; }
        }
    </style>
</head>
<body>
    <div class="game-header">
        <h1>LUNIX Memory Cards Game</h1>
        
        <div class="music-controls">
            <button class="music-btn" id="playPauseBtn">▶</button>
            <div class="volume-control">
                <span>🔊</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
            </div>
        </div>
        
        <div class="game-controls">
            <button class="difficulty-btn active" data-tiles="16">Easy (16 tiles)</button>
            <button class="difficulty-btn" data-tiles="32">Medium (32 tiles)</button>
            <button class="difficulty-btn" data-tiles="48">Hard (48 tiles)</button>
            <button class="control-btn" id="newGameBtn">New Game</button>
        </div>
        <div class="game-stats">
            <div class="stat-box">Time: <span id="timer">00:00</span></div>
            <div class="stat-box">Moves: <span id="moves">0</span></div>
            <div class="stat-box">Best: <span id="bestTime">--:--</span></div>
        </div>
    </div>
    
    <div class="game-board small" id="gameBoard"></div>
    
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2>Congratulations!</h2>
            <p>You completed the game in <span id="finalTime"></span></p>
            <p>Total moves: <span id="finalMoves"></span></p>
            <p id="newRecord" style="display: none; color: #ffeb3b; font-weight: bold;">🎉 New Record! 🎉</p>
            <button class="close-modal" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="music/moonlit_pixels.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Game variables
            let gameBoard = document.getElementById('gameBoard');
            let timerElement = document.getElementById('timer');
            let movesElement = document.getElementById('moves');
            let bestTimeElement = document.getElementById('bestTime');
            let winModal = document.getElementById('winModal');
            let finalTimeElement = document.getElementById('finalTime');
            let finalMovesElement = document.getElementById('finalMoves');
            let newRecordElement = document.getElementById('newRecord');
            
            // Music controls
            let bgMusic = document.getElementById('bgMusic');
            let playPauseBtn = document.getElementById('playPauseBtn');
            let volumeSlider = document.getElementById('volumeSlider');
            
            let tiles = 16;
            let cards = [];
            let flippedCards = [];
            let matchedPairs = 0;
            let moves = 0;
            let timer = null;
            let seconds = 0;
            let gameStarted = false;
            
            // EDITABLE IMAGES: Replace these URLs with your own image paths
const gameImages = [
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card01.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card02.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card03.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card04.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card05.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card06.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card07.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card08.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card09.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card10.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card11.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card12.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card13.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card14.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card15.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card16.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card17.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card18.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card19.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card20.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card21.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card22.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card23.jpg',
  'https://lunix-213.github.io/lunix-213/pages/game/tiles_image/HD/card24.jpg'
];
            // Music functionality
            playPauseBtn.addEventListener('click', () => {
                if (bgMusic.paused) {
                    bgMusic.play();
                    playPauseBtn.textContent = '⏸';
                } else {
                    bgMusic.pause();
                    playPauseBtn.textContent = '▶';
                }
            });
            
            volumeSlider.addEventListener('input', (e) => {
                bgMusic.volume = e.target.value / 100;
            });
            
            // Set initial volume
            bgMusic.volume = 0.5;
            
            // Load best time from localStorage
            function loadBestTime() {
                const bestTime = localStorage.getItem(`bestTime_${tiles}`);
                if (bestTime) {
                    bestTimeElement.textContent = formatTime(parseInt(bestTime));
                } else {
                    bestTimeElement.textContent = '--:--';
                }
            }
            
            // Format time as MM:SS
            function formatTime(totalSeconds) {
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
            
            // Start timer
            function startTimer() {
                if (!gameStarted) {
                    gameStarted = true;
                    timer = setInterval(() => {
                        seconds++;
                        timerElement.textContent = formatTime(seconds);
                    }, 1000);
                }
            }
            
            // Stop timer
            function stopTimer() {
                clearInterval(timer);
                gameStarted = false;
            }
            
            // Reset timer
            function resetTimer() {
                stopTimer();
                seconds = 0;
                timerElement.textContent = '00:00';
            }
            
            // Initialize game
            function initGame() {
                resetTimer();
                moves = 0;
                movesElement.textContent = moves;
                matchedPairs = 0;
                flippedCards = [];
                gameStarted = false;
                
                // Set board class based on tile count
                gameBoard.className = 'game-board';
                if (tiles === 16) {
                    gameBoard.classList.add('small');
                } else if (tiles === 32) {
                    gameBoard.classList.add('medium');
                } else {
                    gameBoard.classList.add('large');
                }
                
                // Clear board
                gameBoard.innerHTML = '';
                
                // Create card pairs
                const pairs = tiles / 2;
                const cardValues = [];
                
                for (let i = 0; i < pairs; i++) {
                    cardValues.push(i);
                    cardValues.push(i);
                }
                
                // Shuffle cards
                for (let i = cardValues.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [cardValues[i], cardValues[j]] = [cardValues[j], cardValues[i]];
                }
                
                // Create card elements
                cards = [];
                cardValues.forEach((value, index) => {
                    const card = document.createElement('div');
                    card.classList.add('card');
                    card.dataset.value = value;
                    
                    const cardFront = document.createElement('div');
                    cardFront.classList.add('card-face', 'card-front');
                    
                    // Use images from the gameImages array
                    if (gameImages[value]) {
                        const img = document.createElement('img');
                        img.src = gameImages[value];
                        img.classList.add('card-icon');
                        cardFront.appendChild(img);
                    } else {
                        // Fallback to numbers if image not available
                        const number = document.createElement('div');
                        number.classList.add('card-number');
                        number.textContent = value + 1;
                        cardFront.appendChild(number);
                    }
                    
                    const cardBack = document.createElement('div');
                    cardBack.classList.add('card-face', 'card-back');
                    
                    card.appendChild(cardFront);
                    card.appendChild(cardBack);
                    
                    card.addEventListener('click', flipCard);
                    
                    gameBoard.appendChild(card);
                    cards.push(card);
                });
                
                loadBestTime();
            }
            
            // Flip card
            function flipCard() {
                if (flippedCards.length >= 2) return;
                if (this.classList.contains('flipped')) return;
                if (this.classList.contains('matched')) return;
                
                startTimer();
                
                this.classList.add('flipped');
                flippedCards.push(this);
                
                if (flippedCards.length === 2) {
                    moves++;
                    movesElement.textContent = moves;
                    
                    const card1 = flippedCards[0];
                    const card2 = flippedCards[1];
                    
                    if (card1.dataset.value === card2.dataset.value) {
                        // Match found
                        setTimeout(() => {
                            card1.classList.add('matched');
                            card2.classList.add('matched');
                            matchedPairs++;
                            
                            if (matchedPairs === tiles / 2) {
                                // Game won
                                stopTimer();
                                finalTimeElement.textContent = formatTime(seconds);
                                finalMovesElement.textContent = moves;
                                
                                // Check if new record
                                const bestTime = localStorage.getItem(`bestTime_${tiles}`);
                                if (!bestTime || seconds < parseInt(bestTime)) {
                                    localStorage.setItem(`bestTime_${tiles}`, seconds);
                                    newRecordElement.style.display = 'block';
                                } else {
                                    newRecordElement.style.display = 'none';
                                }
                                
                                winModal.style.display = 'flex';
                            }
                            
                            flippedCards = [];
                        }, 500);
                    } else {
                        // No match
                        setTimeout(() => {
                            card1.classList.remove('flipped');
                            card2.classList.remove('flipped');
                            flippedCards = [];
                        }, 1000);
                    }
                }
            }
            
            // Event listeners
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    tiles = parseInt(btn.dataset.tiles);
                    initGame();
                });
            });
            
            document.getElementById('newGameBtn').addEventListener('click', initGame);
            
            document.getElementById('playAgainBtn').addEventListener('click', () => {
                winModal.style.display = 'none';
                initGame();
            });
            
            // Initialize game on load
            initGame();
        });
    </script>
</body>
</html>
